# Para Coolify (Docker Compose) o para probar la imagen en local: docker compose up --build
services:
  licitaciones:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:?Definí SITE_URL con el dominio público, ej. https://licitaciones.municipio.gob.ar}
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL}
    ports:
      - '4321:4321'
    volumes:
      - licitaciones-datos:/data

volumes:
  licitaciones-datos:
